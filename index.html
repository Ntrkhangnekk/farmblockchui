<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Key Checker</h1>
        <form id="keyForm">
            <label for="key">Nhập Key:</label>
            <input type="text" id="key" name="key" placeholder="Nhập key tại đây" required>
            <button type="submit">Kiểm tra</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
