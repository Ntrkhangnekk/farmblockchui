<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 300px;
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background-color: #45a049;
    }
    .result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Key Checker</h2>
    <form id="keyForm">
      <input type="text" id="keyInput" placeholder="Nhập Key" required>
      <button type="submit">Kiểm tra</button>
    </form>
    <div id="result" class="result"></div>
  </div>

  <script>
    const form = document.getElementById("keyForm");
    const keyInput = document.getElementById("keyInput");
    const resultDiv = document.getElementById("result");

    form.addEventListener("submit", function(event) {
      event.preventDefault(); // Ngừng việc gửi form

      const key = keyInput.value.trim();

      // Gửi request POST tới backend
      fetch('http://localhost:3000/check-key', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ key: key })
      })
      .then(response => response.json())
      .then(data => {
        resultDiv.textContent = `Kết quả: ${data.text}`;
      })
      .catch(error => {
        resultDiv.textContent = "Đã có lỗi xảy ra!";
      });
    });
  </script>
</body>
</html>
