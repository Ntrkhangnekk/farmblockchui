<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Checker</title>
</head>
<body>

  <h2>Nhập Key để kiểm tra:</h2>

  <form id="keyForm">
    <input type="text" id="keyInput" placeholder="Nhập key" required>
    <button type="submit">Kiểm tra</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById("keyForm");
    const keyInput = document.getElementById("keyInput");
    const resultDiv = document.getElementById("result");

    form.addEventListener("submit", function(event) {
      event.preventDefault(); // Ngừng việc gửi form

      const key = keyInput.value.trim();

      // Gửi request POST tới backend
      fetch('http://localhost:3000/check-key', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ key: key })
      })
      .then(response => response.json())
      .then(data => {
        resultDiv.textContent = `Kết quả: ${data.text}`;
      })
      .catch(error => {
        resultDiv.textContent = "Đã có lỗi xảy ra!";
      });
    });
  </script>

</body>
</html>
